<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro - ONG Esperança</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header><h1>Cadastro</h1><nav><a href="index.html">Início</a><a href="projetos.html">Projetos</a><a href="cadastro.html">Cadastro</a></nav></header>
<main><form action="#" method="post">
<fieldset><legend>Dados pessoais</legend><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" required><label for="cpf">CPF</label><input id="cpf" name="cpf" type="text" inputmode="numeric" pattern="[0-9]{11}" placeholder="Somente números" required><label for="nascimento">Data de nascimento</label><input id="nascimento" name="nascimento" type="date" required></fieldset>
<fieldset><legend>Contato e endereço</legend><label for="email">E-mail</label><input id="email" name="email" type="email" required><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" pattern="[0-9]{10,11}" required><label for="cep">CEP</label><input id="cep" name="cep" type="text" inputmode="numeric" pattern="[0-9]{8}" placeholder="Somente números" required><label for="endereco">Endereço</label><input id="endereco" name="endereco" type="text" required><label for="cidade">Cidade</label><input id="cidade" name="cidade" type="text" required><label for="estado">Estado</label><input id="estado" name="estado" type="text" maxlength="2" required></fieldset>
<fieldset><legend>Participação</legend><label for="tipo">Como deseja ajudar?</label><select id="tipo" name="tipo" required><option value="">Selecione</option><option>Doação</option><option>Voluntariado</option></select></fieldset><button type="submit">Enviar cadastro</button></form></main><footer><p>&copy; 2026 ONG Esperança</p></footer></body></html>
